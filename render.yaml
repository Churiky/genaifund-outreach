services:
  - type: web
    name: genaifund-outreach
    env: python
    buildCommand: "pip install -r requirements.txt && cd ui && npm install && npm run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: genaifund-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_USER_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAX_SENDS_PER_RUN
        value: "25"
      - key: MAX_SENDS_PER_DAY
        value: "100"
      - key: COOLDOWN_SECONDS
        value: "90"

databases:
  - name: genaifund-db
    plan: free
